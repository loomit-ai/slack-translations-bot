[project]
name = "slack-translator"
version = "0.1.0"
description = "Private translation for X3M staff in Slack"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiohttp>=3.10,<4",
    "httpx>=0.27,<1",
    "lingua-language-detector>=2.2,<3",
    "prometheus-client>=0.21,<1",
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.7,<3",
    "slack-bolt>=1.30,<2",
]

[dependency-groups]
dev = [
    "import-linter>=2.1,<3",
    "pyright>=1.1.400",
    "pytest>=8.3,<9",
    "pytest-asyncio>=0.25,<2",
    "pytest-cov>=6,<8",
    "ruff>=0.9",
]

[build-system]
requires = ["uv_build>=0.13,<0.14"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC", "RUF"]
# The design wording uses typographic quotes and the fixtures use other scripts on purpose.
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.pyright]
include = ["src", "tests", "scripts"]
pythonVersion = "3.12"
typeCheckingMode = "standard"
strict = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib"
pythonpath = ["."]
asyncio_mode = "auto"
markers = ["live: needs a real Slack app or provider credentials; not part of make test"]

[tool.coverage.run]
source = ["slack_translator"]
branch = true

[tool.coverage.report]
# The floor `make coverage` enforces, in line and branch coverage together.
fail_under = 90
show_missing = true
skip_covered = true

[tool.importlinter]
root_package = "slack_translator"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "FF-01 layers: delivery over actions and infrastructure over domain"
type = "layers"
layers = [
    "slack_translator.delivery",
    "slack_translator.actions | slack_translator.infrastructure",
    "slack_translator.domain",
]

[[tool.importlinter.contracts]]
name = "FF-01 slack_bolt only in delivery"
type = "forbidden"
source_modules = [
    "slack_translator.domain",
    "slack_translator.actions",
    "slack_translator.infrastructure",
]
forbidden_modules = ["slack_bolt"]

[[tool.importlinter.contracts]]
name = "FF-01 lingua only in infrastructure.lingua_classifier"
type = "forbidden"
source_modules = [
    "slack_translator.domain",
    "slack_translator.actions",
    "slack_translator.delivery",
    "slack_translator.infrastructure",
]
forbidden_modules = ["lingua"]
ignore_imports = ["slack_translator.infrastructure.lingua_classifier -> lingua"]
unmatched_ignore_imports_alerting = "none"

[[tool.importlinter.contracts]]
name = "FF-01 httpx only in infrastructure"
type = "forbidden"
source_modules = [
    "slack_translator.domain",
    "slack_translator.actions",
    "slack_translator.delivery",
]
forbidden_modules = ["httpx"]
allow_indirect_imports = true
