_metadata:
  major_version: 2
  minor_version: 1
display_information:
  name: X3M Translator (staging)
  description: Private translations for X3M staff. Staging build.
features:
  bot_user:
    display_name: X3M Translator (staging)
    always_online: false
  shortcuts:
    - name: Translate this message
      type: message
      callback_id: translate_message
      description: Shows you a private translation of this message.
oauth_config:
  scopes:
    bot:
      - commands # the message shortcut
      - chat:write # chat.postEphemeral fallback
      - channels:history # Retry and offer clicks fetch the message
      - groups:history
      - channels:read # startup membership check; member list in 0.2
      - groups:read
      - users:read # home-workspace check; recipients in 0.2
settings:
  # [0.2] message events; not subscribed in 0.1
  # event_subscriptions:
  #   bot_events:
  #     - message.channels
  #     - message.groups
  interactivity:
    is_enabled: true
  org_deploy_enabled: false
  socket_mode_enabled: true
  token_rotation_enabled: false
